[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicengine"
version = "0.1.0"
description = "Text- and lyric-conditioned music generation: CLAP conditioning, RVQ codec, AR token engine, diffusion refiner, data curation and privacy-preserving post-training."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
